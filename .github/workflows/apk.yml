name: Build APK (debug)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Gerar pasta Android
        run: flutter create --platforms=android .

      - name: Configurar Android SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/' android/app/build.gradle
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 35/' android/app/build.gradle

      - name: Adicionar permissões no AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          perl -0pi -e 's{(<application)}{<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    $1}' "$MANIFEST"

      - name: Limpar cache e atualizar dependências
        run: |
          flutter clean
          flutter pub upgrade

      - name: Baixar dependências
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: emprestafacil-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
